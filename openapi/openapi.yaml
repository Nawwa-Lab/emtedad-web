      '/api/v1/auth/context-switch':
        {
          'put':
            {
              'description': 'Switches the active context of the current session between "org" (organization) and "community" (individual). This endpoint is intercepted and served by the API Gateway (context-switch middleware), which updates the session stored in Redis. It is documented here for API reference; the identity service does not handle the request itself.',
