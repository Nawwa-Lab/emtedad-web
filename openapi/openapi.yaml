              'parameters': [],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/ContextSwitchDto' } },
                    },
                },
              'responses':
                {
                  '200':
                    {
                      'description': 'Context switched successfully.',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties':
                                    {
                                      'message':
                                        { 'type': 'string', 'example': 'Context switched' },
                                      'context':
                                        {
                                          'type': 'string',
                                          'enum': ['org', 'community'],
                                          'example': 'org',
                                        },
                                    },
                                },
                            },
                        },
                    },
                  '400':
                    {
                      'description': 'Invalid context, malformed request, or user does not belong to an organization.',
                    },
                  '401': { 'description': 'Authentication required or session expired.' },
                },
              'security': [{ 'cookie': [] }],
              'summary': 'Switch the active session context',
              'tags': ['Authentication'],
            },
        },
